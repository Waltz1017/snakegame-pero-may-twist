<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Math Snake</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #16213e;
    --grid: #1c2b4a;
    --snake: #38d39f;
    --snake-head: #7cf5c4;
    --food: #ff5d73;
    --accent: #ffd166;
    --text: #e8eef7;
    --muted: #8fa3c4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #19335c, var(--bg) 70%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    user-select: none;
  }

  .game {
    width: min(92vw, 560px);
    padding: 20px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .stat {
    background: var(--panel);
    border: 1px solid #26365c;
    border-radius: 12px;
    padding: 8px 14px;
    min-width: 78px;
    text-align: center;
  }
  .stat .label {
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .stat .value {
    font-size: 22px;
    font-weight: 700;
    margin-top: 2px;
  }
  .stat.lives .value { color: var(--food); letter-spacing: 2px; }

  .board-wrap {
    position: relative;
    background: var(--panel);
    border: 2px solid #2c406b;
    border-radius: 16px;
    padding: 10px;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 8px;
    background: var(--grid);
  }

  .overlay {
    position: absolute;
    inset: 10px;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(9, 16, 34, .88);
    border-radius: 8px;
    text-align: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay h1 { margin: 0 0 8px; font-size: 34px; }
  .overlay p { color: var(--muted); margin: 6px 0 18px; line-height: 1.5; }

  button {
    font: inherit;
    font-weight: 700;
    color: #0f172a;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 12px 26px;
    cursor: pointer;
    transition: transform .1s ease, filter .1s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(2px); }

  /* Math modal */
  .math-card {
    width: min(90%, 360px);
    background: linear-gradient(160deg, #1f2f54, #142044);
    border: 2px solid var(--accent);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    animation: pop .18s ease-out;
  }
  @keyframes pop {
    from { transform: scale(.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .math-card .tag {
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 800;
  }
  .problem {
    font-size: 46px;
    font-weight: 800;
    margin: 14px 0 6px;
    letter-spacing: .02em;
  }
  .hint { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

  .answer-form { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  input[type=number] {
    width: 100%;
    font: inherit;
    font-size: 30px;
    font-weight: 700;
    text-align: center;
    color: var(--text);
    background: #0d1832;
    border: 2px solid #38507f;
    border-radius: 12px;
    padding: 10px;
    outline: none;
  }
  input[type=number]:focus { border-color: var(--accent); }
  .submit { width: 100%; }

  .feedback { min-height: 20px; font-weight: 700; margin-top: 10px; font-size: 14px; }
  .feedback.good { color: var(--snake); }
  .feedback.bad { color: var(--food); }

  .controls-note {
    margin-top: 14px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    line-height: 1.6;
  }
  kbd {
    background: #26365c;
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 11px;
    color: var(--text);
  }
</style>
</head>
<body>
<div class="game">
  <div class="hud">
    <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
    <div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
    <div class="stat lives"><div class="label">Lives</div><div class="value" id="lives">♥♥♥</div></div>
  </div>

  <div class="board-wrap">
    <canvas id="board" width="480" height="480"></canvas>

    <div class="overlay show" id="startOverlay">
      <div>
        <h1>🐍 Math Snake</h1>
        <p>Guide the snake to the food — but you can only eat after solving the math problem that appears.</p>
        <button id="startBtn">Start Game</button>
        <div class="controls-note">
          Move with <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><br />
          Wrong answers cost a life. Eat food to level up.
        </div>
      </div>
    </div>

    <div class="overlay" id="mathOverlay">
      <div class="math-card">
        <div class="tag">Solve to eat</div>
        <div class="problem" id="problemText">1 + 1 = ?</div>
        <div class="hint" id="hintText">Level 1</div>
        <form class="answer-form" id="answerForm">
          <input type="number" id="answerInput" autocomplete="off" inputmode="numeric" placeholder="?" />
          <button type="submit" class="submit">Submit Answer</button>
        </form>
        <div class="feedback" id="feedback"></div>
      </div>
    </div>

    <div class="overlay" id="pauseOverlay">
      <div>
        <h1>Paused</h1>
        <button id="resumeBtn">Resume</button>
      </div>
    </div>

    <div class="overlay" id="overOverlay">
      <div>
        <h1>Game Over</h1>
        <p id="overText">Score: 0</p>
        <button id="restartBtn">Play Again</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');

  const CELLS = 24;
  const CELL = canvas.width / CELLS;

  const els = {
    score: document.getElementById('score'),
    best: document.getElementById('best'),
    level: document.getElementById('level'),
    lives: document.getElementById('lives'),
    startOverlay: document.getElementById('startOverlay'),
    mathOverlay: document.getElementById('mathOverlay'),
    pauseOverlay: document.getElementById('pauseOverlay'),
    overOverlay: document.getElementById('overOverlay'),
    problemText: document.getElementById('problemText'),
    hintText: document.getElementById('hintText'),
    answerForm: document.getElementById('answerForm'),
    answerInput: document.getElementById('answerInput'),
    feedback: document.getElementById('feedback'),
    startBtn: document.getElementById('startBtn'),
    resumeBtn: document.getElementById('resumeBtn'),
    restartBtn: document.getElementById('restartBtn'),
    overText: document.getElementById('overText'),
  };

  let snake, dir, nextDir, food, score, lives, state, problem;
  let lastTime = 0, acc = 0;
  let best = Number(localStorage.getItem('mathSnakeBest') || 0);
  els.best.textContent = best;

  const KEY_DIR = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0],
  };

  function reset() {
    snake = [
      { x: 12, y: 14 },
      { x: 11, y: 14 },
      { x: 10, y: 14 },
    ];
    dir = [1, 0];
    nextDir = [1, 0];
    score = 0;
    lives = 3;
    acc = 0;
    placeFood();
    updateHud();
  }

  function updateHud() {
    els.score.textContent = score;
    els.level.textContent = 1 + Math.floor(score / 3);
    els.lives.textContent = '♥'.repeat(lives) + '♡'.repeat(3 - lives);
  }

  function placeFood() {
    const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
    const free = [];
    for (let y = 0; y < CELLS; y++) {
      for (let x = 0; x < CELLS; x++) {
        if (!occupied.has(`${x},${y}`)) free.push({ x, y });
      }
    }
    food = free[Math.floor(Math.random() * free.length)];
  }

  function level() { return 1 + Math.floor(score / 3); }

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function makeProblem() {
    const lv = level();
    const types = lv < 2 ? ['+', '-'] : lv < 4 ? ['+', '-', '×'] : ['+', '-', '×', '÷'];
    const type = types[randInt(0, types.length - 1)];
    let a, b, text, answer;

    if (type === '+') {
      const max = Math.min(20 + lv * 15, 200);
      a = randInt(2, max); b = randInt(2, max);
      text = `${a} + ${b}`; answer = a + b;
    } else if (type === '-') {
      const max = Math.min(20 + lv * 15, 200);
      a = randInt(3, max); b = randInt(1, a - 1);
      text = `${a} − ${b}`; answer = a - b;
    } else if (type === '×') {
      const max = Math.min(5 + lv * 2, 15);
      a = randInt(2, max); b = randInt(2, max);
      text = `${a} × ${b}`; answer = a * b;
    } else {
      b = randInt(2, Math.min(5 + lv * 2, 12));
      answer = randInt(2, Math.min(5 + lv * 2, 12));
      a = b * answer;
      text = `${a} ÷ ${b}`;
    }
    return { text, answer, hint: `Level ${lv} · ${({ '+': 'Addition', '-': 'Subtraction', '×': 'Multiplication', '÷': 'Division' })[type]}` };
  }

  function showProblem() {
    problem = makeProblem();
    els.problemText.textContent = problem.text + ' = ?';
    els.hintText.textContent = problem.hint + ' · Wrong answer costs 1 life';
    els.feedback.textContent = '';
    els.feedback.className = 'feedback';
    els.answerInput.value = '';
    state = 'problem';
    els.mathOverlay.classList.add('show');
    setTimeout(() => els.answerInput.focus(), 30);
  }

  function correctAnswer() {
    els.mathOverlay.classList.remove('show');
    // The head already occupies the food cell, so the snake has grown.
    score += 1;
    if (score > best) {
      best = score;
      localStorage.setItem('mathSnakeBest', best);
      els.best.textContent = best;
    }
    updateHud();
    placeFood();
    state = 'playing';
    lastTime = performance.now();
  }

  function wrongAnswer() {
    lives -= 1;
    updateHud();
    if (lives <= 0) {
      endGame();
      return;
    }
    els.feedback.textContent = 'Not quite — try this one!';
    els.feedback.className = 'feedback bad';
    problem = makeProblem();
    els.problemText.textContent = problem.text + ' = ?';
    els.answerInput.value = '';
    els.answerInput.focus();
  }

  function endGame() {
    els.mathOverlay.classList.remove('show');
    state = 'gameover';
    els.overText.textContent = `You scored ${score}. ${score >= best && score > 0 ? 'New best!' : ''}`;
    els.overOverlay.classList.add('show');
  }

  function step() {
    dir = nextDir;
    const head = snake[0];
    const nx = head.x + dir[0];
    const ny = head.y + dir[1];

    if (nx < 0 || ny < 0 || nx >= CELLS || ny >= CELLS ||
        snake.some((s, i) => i < snake.length - 1 && s.x === nx && s.y === ny)) {
      endGame();
      return;
    }

    snake.unshift({ x: nx, y: ny });
    if (nx === food.x && ny === food.y) {
      // Keep the new head (growth) and freeze until the math is solved.
      showProblem();
      return;
    }
    snake.pop();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,.04)';
    ctx.lineWidth = 1;
    for (let i = 1; i < CELLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height);
      ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    // Food
    ctx.fillStyle = '#ff5d73';
    ctx.shadowColor = '#ff5d73';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.36, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Snake
    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? '#7cf5c4' : '#38d39f';
      const pad = i === 0 ? 1 : 2;
      ctx.beginPath();
      ctx.roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
      ctx.fill();
    });

    // Eyes on head
    const h = snake[0];
    const cx = h.x * CELL + CELL / 2;
    const cy = h.y * CELL + CELL / 2;
    const off = CELL * 0.16;
    const fwd = CELL * 0.14;
    ctx.fillStyle = '#0f172a';
    const eye = (dx, dy) => { ctx.beginPath(); ctx.arc(cx + dx, cy + dy, CELL * 0.07, 0, Math.PI * 2); ctx.fill(); };
    if (dir[0] === 1) { eye(fwd, -off); eye(fwd, off); }
    else if (dir[0] === -1) { eye(-fwd, -off); eye(-fwd, off); }
    else if (dir[1] === 1) { eye(-off, fwd); eye(off, fwd); }
    else { eye(-off, -fwd); eye(off, -fwd); }
  }

  function loop(time) {
    requestAnimationFrame(loop);
    if (state !== 'playing') { lastTime = time; return; }
    const speed = Math.max(70, 150 - (level() - 1) * 10);
    acc += time - lastTime;
    lastTime = time;
    while (acc >= speed) {
      step();
      acc -= speed;
      if (state !== 'playing') break;
    }
    draw();
  }

  function startGame() {
    els.startOverlay.classList.remove('show');
    els.overOverlay.classList.remove('show');
    els.pauseOverlay.classList.remove('show');
    reset();
    state = 'playing';
    lastTime = performance.now();
    canvas.focus();
  }

  window.addEventListener('keydown', (e) => {
    if (state === 'problem') {
      if (e.key === 'Escape') e.preventDefault();
      return;
    }
    if (e.key === ' ' || e.key === 'p' || e.key === 'P') {
      if (state === 'playing') { state = 'paused'; els.pauseOverlay.classList.add('show'); }
      else if (state === 'paused') { state = 'playing'; els.pauseOverlay.classList.remove('show'); lastTime = performance.now(); }
      e.preventDefault();
      return;
    }
    const nd = KEY_DIR[e.key];
    if (!nd) return;
    if ((dir[0] === -nd[0] && dir[1] === -nd[1]) && snake.length > 1) return;
    nextDir = nd;
    e.preventDefault();
  });

  els.answerForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (state !== 'problem') return;
    const val = els.answerInput.value.trim();
    if (val === '') return;
    if (Number(val) === problem.answer) correctAnswer();
    else wrongAnswer();
  });

  els.startBtn.addEventListener('click', startGame);
  els.restartBtn.addEventListener('click', startGame);
  els.resumeBtn.addEventListener('click', () => {
    state = 'playing';
    els.pauseOverlay.classList.remove('show');
    lastTime = performance.now();
  });

  reset();
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
